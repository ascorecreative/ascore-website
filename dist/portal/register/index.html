    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // A phone can advertise a desktop viewport or settle its viewport after
      // this head script. Set its CSS device width without restricting zoom.
      (() => {
        const phone = Math.min(screen.width, screen.height) <= 600 &&
          (navigator.maxTouchPoints > 0 || matchMedia('(pointer:coarse)').matches || /iPhone|iPod|Android.*Mobile/i.test(navigator.userAgent));
        if (!phone) return;
        const viewport = document.querySelector('meta[name="viewport"]');
        const deviceWidth = () => screen.orientation?.type
          ? (screen.orientation.type.startsWith('landscape') ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height))
          : (Math.abs(window.orientation || 0) === 90 ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height));
        const sync = () => viewport.setAttribute('content', `width=${deviceWidth()}, initial-scale=1.0, viewport-fit=cover`);
        sync();
        document.addEventListener('DOMContentLoaded', sync, { once: true });
        window.addEventListener('pageshow', sync);
        window.addEventListener('orientationchange', sync);
      })();
    </script>
